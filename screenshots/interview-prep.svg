  <text x="80" y="282" fill="#f85149" font-family="sans-serif" font-size="13" font-weight="bold">Q2</text>
  <text x="110" y="282" fill="#e6edf3" font-family="sans-serif" font-size="13">"How would you design a CI/CD pipeline for a microservices architecture?"</text>
  <text x="80" y="300" fill="#8b949e" font-family="sans-serif" font-size="11">💡 Focus on: build automation, testing strategy, deployment strategies</text>
