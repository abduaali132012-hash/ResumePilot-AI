  <text x="110" y="222" fill="#e6edf3" font-family="sans-serif" font-size="13">"Describe your experience with Kubernetes in a production environment."</text>
  <text x="80" y="240" fill="#8b949e" font-family="sans-serif" font-size="11">💡 Focus on: cluster management, scaling, monitoring, and incident response</text>
